<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관심 사이트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "맑은 고딕", Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(157, 120, 255, 0.28), transparent 30%),
                radial-gradient(circle at 80% 15%, rgba(203, 134, 255, 0.20), transparent 28%),
                radial-gradient(circle at 30% 80%, rgba(110, 78, 255, 0.20), transparent 32%),
                radial-gradient(circle at 75% 75%, rgba(146, 96, 255, 0.18), transparent 30%),
                linear-gradient(180deg, #1a1735 0%, #231d4c 35%, #2b235c 60%, #17132b 100%);
            color: white;
            position: relative;
        }

        /* 별 느낌 */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 30% 40%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 55% 25%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 70% 50%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 85% 30%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.5px 1.5px at 20% 75%, rgba(255,255,255,0.65), transparent),
                radial-gradient(2px 2px at 60% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 90% 70%, rgba(255,255,255,0.75), transparent);
            opacity: 0.65;
            pointer-events: none;
        }

        .page {
            position: relative;
            width: 100%;
            height: 900px;
            overflow: hidden;
            z-index: 1;
        }

        .title-wrap {
            position: absolute;
            left: 40px;
            top: 25px;
            z-index: 5;
        }

        h2 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 8px;
            color: #ffffff;
        }

        .intro {
            margin-top: 14px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.7;
        }

        .hint {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        /* 원형 배치 영역 - 아래로 내림 */
        .orbit-area {
            position: absolute;
            left: 50%;
            top: 60%;
            width: 900px;
            height: 900px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
        }

        .orbit-guide {
            position: absolute;
            inset: 90px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow:
                0 0 40px rgba(171, 123, 255, 0.08),
                inset 0 0 50px rgba(255, 255, 255, 0.04);
        }

        .orbit-guide::before {
            content: "";
            position: absolute;
            inset: 35px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 150px;
            height: 210px;
            margin-left: -75px;
            margin-top: -105px;
            border-radius: 20px;
            padding: 18px 16px;
            text-decoration: none;
            color: white;
            box-shadow:
                0 16px 35px rgba(0, 0, 0, 0.38),
                0 0 30px rgba(173, 120, 255, 0.12);
            backdrop-filter: blur(4px);
            overflow: hidden;
            pointer-events: auto;
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.22),
                rgba(255,255,255,0.04)
            );
            opacity: 0.7;
            pointer-events: none;
        }

        .card:hover {
            filter: brightness(1.12);
            box-shadow:
                0 24px 45px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(199, 149, 255, 0.22);
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
        }

        .card-no {
            font-size: 13px;
            opacity: 0.75;
            letter-spacing: 2px;
        }

        .card h3 {
            margin: 10px 0 8px;
            font-size: 24px;
            line-height: 1.15;
            font-weight: 700;
            color: white;
        }

        .card p {
            margin: 0;
            font-size: 12.5px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.88);
        }

        .card .big-num {
            position: absolute;
            right: 4px;
            bottom: -2px;
            font-size: 40px;
            font-weight: 300;
            opacity: 0.32;
        }

        /* 1,2,3,4 반복 색상 */
        .type-1 {
            background: linear-gradient(160deg, #5d3eff 0%, #8f5cff 50%, #c184ff 100%);
        }

        .type-2 {
            background: linear-gradient(160deg, #3f38c9 0%, #6d52e0 55%, #9d72ff 100%);
        }

        .type-3 {
            background: linear-gradient(160deg, #6d47d9 0%, #8a63eb 52%, #c090ff 100%);
        }

        .type-4 {
            background: linear-gradient(160deg, #4e3bcf 0%, #925be8 50%, #ff92d0 100%);
        }

        @media screen and (max-width: 900px) {
            .page {
                height: 820px;
            }

            .orbit-area {
                width: 760px;
                height: 760px;
                top: 62%;
            }

            .orbit-guide {
                inset: 80px;
            }

            .card {
                width: 128px;
                height: 185px;
                margin-left: -64px;
                margin-top: -92px;
                padding: 15px 13px;
                border-radius: 16px;
            }

            .card h3 {
                font-size: 20px;
            }

            .card p {
                font-size: 11px;
            }

            .card .big-num {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="page" id="page">

        <div class="title-wrap">
            
            <div class="hint">Move your mouse →</div>
        </div>

        <div class="orbit-area" id="orbitArea">
            <div class="orbit-guide"></div>
        </div>

    </div>

    <script>
        const orbitArea = document.getElementById("orbitArea");
        const page = document.getElementById("page");

        const items = [
            {
                type: 1,
                title: "Notion",
                desc: "개인과 팀이 정보를 기록하고 공유할 수 있는 협업 도구입니다.",
                link: "https://app.notion.com/p/33b653c248c980f5b09eeac1b6178306?source=copy_link"
            },
            {
                type: 2,
                title: "GitHub",
                desc: "소스 코드를 저장하고 프로젝트를 관리할 수 있는 개발 플랫폼입니다.",
                link: "https://github.com/sehiron99-png"
            },
            {
                type: 3,
                title: "Naver",
                desc: "뉴스, 검색, 블로그, 지도 등 다양한 정보를 확인할 수 있는 포털 사이트입니다.",
                link: "https://www.naver.com/"
            },
            {
                type: 4,
                title: "Google",
                desc: "자료 조사, 이미지 검색, 개발 오류 해결 등에 활용하기 좋은 검색 사이트입니다.",
                link: "https://www.google.com/"
            }
        ];

        const cards = [];
        const totalCards = 16; // 4개 x 4번 반복
        const radius = 300;    // 원 반지름
        let targetSpeed = 0;   // 목표 회전 속도 (deg/frame)
        let currentSpeed = 0;  // 현재 회전 속도
        let currentRotate = 0; // 누적 회전 각도
        let isHovering = false; // 카드 영역에 마우스가 있는지

        // 16개 카드 생성
        for (let i = 0; i < totalCards; i++) {
            const data = items[i % 4];
            const card = document.createElement("a");
            card.className = `card type-${data.type}`;
            card.href = data.link;
            card.target = "_blank";
            card.innerHTML = `
                <div class="card-content">
                    <div class="card-no">CARD ${String((i % 4) + 1).padStart(2, "0")}</div>
                    <h3>${data.title}</h3>
                    <p>${data.desc}</p>
                    <div class="big-num">${(i % 4) + 1}</div>
                </div>
            `;
            orbitArea.appendChild(card);
            cards.push(card);
        }

        function renderCards() {
            // 카드 영역에 마우스가 없으면 속도를 0으로 수렴
            if (!isHovering) targetSpeed = 0;

            // 현재 속도를 목표 속도로 부드럽게 보간
            currentSpeed += (targetSpeed - currentSpeed) * 0.08;

            // 누적 각도에 속도 더하기
            currentRotate += currentSpeed;

            cards.forEach((card, i) => {
                const baseAngle = (360 / totalCards) * i;
                const angle = baseAngle + currentRotate;

                card.style.transform =
                    `rotate(${angle}deg) translateY(-${radius}px) rotate(${-angle}deg)`;
            });

            requestAnimationFrame(renderCards);
        }

        // 카드 영역(orbitArea) 위에서 마우스 이동 시에만 반응
        orbitArea.addEventListener("mousemove", (e) => {
            const rect = page.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percent = x / rect.width;

            // 왼쪽 절반 → 시계 방향(+), 오른쪽 절반 → 반시계 방향(-)
            // 중앙에서 멀어질수록 속도 증가 (최대 ±2.5 deg/frame)
            if (percent < 0.5) {
                // 왼쪽: 0에 가까울수록 빠른 시계방향
                targetSpeed = (0.5 - percent) * 2 * 2.5;
            } else {
                // 오른쪽: 1에 가까울수록 빠른 반시계방향
                targetSpeed = -(percent - 0.5) * 2 * 2.5;
            }
        });

        // 카드 영역 진입/이탈 감지
        orbitArea.addEventListener("mouseenter", () => {
            isHovering = true;
        });

        orbitArea.addEventListener("mouseleave", () => {
            isHovering = false;
        });

        renderCards();
    </script>

</body>
</html>
