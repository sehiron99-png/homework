<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: "맑은 고딕", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 40px 24px;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(165, 110, 255, 0.22), transparent 28%),
                radial-gradient(circle at 80% 15%, rgba(113, 89, 255, 0.18), transparent 30%),
                radial-gradient(circle at 30% 80%, rgba(219, 122, 255, 0.18), transparent 28%),
                radial-gradient(circle at 75% 75%, rgba(111, 163, 255, 0.14), transparent 30%),
                linear-gradient(180deg, #15122f 0%, #221b4a 45%, #16122c 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* 반짝이는 점 배경 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 24% 72%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 48% 26%, rgba(255,255,255,0.55), transparent),
                radial-gradient(1.5px 1.5px at 66% 56%, rgba(255,255,255,0.62), transparent),
                radial-gradient(2px 2px at 84% 20%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 88% 76%, rgba(255,255,255,0.58), transparent);
            opacity: 0.65;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .title-box {
            margin-bottom: 28px;
            animation: fadeDown 0.8s ease;
        }

        .title-box h2 {
            margin: 0 0 10px;
            font-size: 34px;
            letter-spacing: 8px;
            color: #ffffff;
        }

        .title-box p {
            margin: 0;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.7;
            font-size: 15px;
        }

        .signup-card {
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            padding: 34px 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.30),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            animation: fadeUp 0.9s ease;
        }

        .signup-card::before {
            content: "";
            position: absolute;
            top: -80px;
            right: -80px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(205, 145, 255, 0.35), transparent 65%);
        }

        .signup-card::after {
            content: "";
            position: absolute;
            bottom: -90px;
            left: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(111, 163, 255, 0.28), transparent 65%);
        }

        .card-inner {
            position: relative;
            z-index: 2;
        }

        .card-inner h3 {
            margin: 0 0 10px;
            font-size: 28px;
            color: #ffffff;
        }

        .card-inner .sub-text {
            margin: 0 0 28px;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.7;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

/* select 드롭다운 글자 안 보이는 문제 해결 */
.field select {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
}

.field select option {
    color: #222222;
    background-color: #ffffff;
}

.field select option:first-child {
    color: #777777;
}

        .field input::placeholder,
        .field textarea::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: rgba(206, 171, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(171, 123, 255, 0.16);
            background: rgba(255, 255, 255, 0.12);
        }

        .field textarea {
            min-height: 130px;
            resize: vertical;
        }

        .option-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 20px;
        }

        .option-box {
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .option-box .option-title {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
            color: #ffffff;
        }

        .choice-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
        }

        .choice-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.86);
            cursor: pointer;
        }

        .choice-group input {
            width: auto;
            accent-color: #b98cff;
        }

        .btn-area {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 14px 26px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-submit {
            color: white;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.28);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(139, 92, 246, 0.35);
        }

        .btn-reset {
            color: white;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.16);
        }

        .notice {
            margin-top: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.62);
        }

        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media screen and (max-width: 768px) {
            body {
                padding: 24px 16px;
            }

            .title-box h2 {
                font-size: 28px;
                letter-spacing: 5px;
            }

            .signup-card {
                padding: 24px 18px;
                border-radius: 20px;
            }

            .form-grid,
            .option-row {
                grid-template-columns: 1fr;
            }

            .card-inner h3 {
                font-size: 24px;
            }

            .btn-area {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="signup-card">
            <div class="card-inner">
                <h3>Join My Blog</h3>
                <p class="sub-text">
                    간단한 정보를 입력해 회원가입을 진행할 수 있습니다.
                    디자인과 입력 구성을 조금 더 보기 좋게 정리했습니다.
                </p>

                <form action="#" method="post">
                    <div class="form-grid">

                        <div class="field">
                            <label for="userId">아이디</label>
                            <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
                        </div>

                        <div class="field">
                            <label for="userPw">비밀번호</label>
                            <input type="password" id="userPw" name="userPw" placeholder="비밀번호를 입력하세요" required>
                        </div>

                        <div class="field">
                            <label for="userName">이름</label>
                            <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요" required>
                        </div>

                        <div class="field">
                            <label for="email">이메일</label>
                            <input type="email" id="email" name="email" placeholder="example@email.com">
                        </div>

                        <div class="field full">
                            <label for="interest">관심 분야</label>
                            <select id="interest" name="interest">
                                <option value="">선택하세요</option>
                                <option value="web">웹 개발</option>
                                <option value="ai">인공지능</option>
                                <option value="data">데이터 분석</option>
                                <option value="design">디자인</option>
                            </select>
                        </div>

                        <div class="option-row">
                            <div class="option-box">
                                <span class="option-title">성별</span>
                                <div class="choice-group">
                                    <label><input type="radio" name="gender" value="female"> 여성</label>
                                    <label><input type="radio" name="gender" value="male"> 남성</label>
                                    <label><input type="radio" name="gender" value="none"> 선택 안 함</label>
                                </div>
                            </div>

                            <div class="option-box">
                                <span class="option-title">수신 동의</span>
                                <div class="choice-group">
                                    <label><input type="checkbox" name="agree" value="post"> 새 글 알림 받기</label>
                                    <label><input type="checkbox" name="agree" value="event"> 이벤트 소식 받기</label>
                                </div>
                            </div>
                        </div>

                        <div class="field full">
                            <label for="memo">자기소개</label>
                            <textarea id="memo" name="memo" placeholder="간단한 자기소개를 작성하세요"></textarea>
                        </div>

                    </div>

                    <div class="btn-area">
                        <button type="submit" class="btn btn-submit">가입하기</button>
                        <button type="reset" class="btn btn-reset">다시쓰기</button>
                    </div>

                    <p class="notice">
                        * 아이디, 비밀번호, 이름은 필수 입력 항목입니다.
                    </p>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
