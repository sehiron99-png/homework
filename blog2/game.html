<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Diamond Catch Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "맑은 고딕", Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(177, 126, 255, 0.18), transparent 28%),
                radial-gradient(circle at 80% 75%, rgba(111, 155, 255, 0.14), transparent 30%),
                linear-gradient(180deg, #080811 0%, #15122f 50%, #070710 100%);
            color: white;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 25% 70%, rgba(255,255,255,0.55), transparent),
                radial-gradient(2px 2px at 45% 32%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 68% 55%, rgba(255,255,255,0.55), transparent),
                radial-gradient(2px 2px at 86% 25%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 90% 78%, rgba(255,255,255,0.5), transparent);
            opacity: 0.7;
            animation: twinkle 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .game-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            position: absolute;
            top: 24px;
            left: 28px;
            right: 28px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 4px;
        }

        .title p {
            margin: 6px 0 0;
            font-size: 13px;
            color: rgba(255,255,255,0.65);
        }

        .score-box {
            display: flex;
            gap: 12px;
        }

        .info {
            min-width: 95px;
            padding: 10px 14px;
            border-radius: 14px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 10px 28px rgba(0,0,0,0.28);
        }

        .info span {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 2px;
        }

        .info strong {
            display: block;
            margin-top: 4px;
            font-size: 24px;
            color: white;
        }

        .start-screen,
        .end-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 12, 0.68);
            backdrop-filter: blur(6px);
        }

        .panel {
            width: min(520px, 88%);
            padding: 34px 28px;
            border-radius: 26px;
            text-align: center;
            background:
                radial-gradient(circle at 25% 20%, rgba(190, 140, 255, 0.18), transparent 30%),
                rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 20px 48px rgba(0,0,0,0.38);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 34px;
            letter-spacing: 3px;
        }

        .panel p {
            margin: 0 0 24px;
            color: rgba(255,255,255,0.75);
            line-height: 1.7;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            box-shadow: 0 12px 28px rgba(139, 92, 246, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 35px rgba(139, 92, 246, 0.45);
        }

        .player {
            position: absolute;
            bottom: 34px;
            left: 50%;
            width: 110px;
            height: 28px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(135deg, #8b5cf6, #c084fc);
            box-shadow:
                0 0 25px rgba(192, 132, 252, 0.55),
                0 12px 28px rgba(0,0,0,0.35);
            z-index: 5;
        }

        .player::before {
            content: "◆";
            position: absolute;
            left: 50%;
            top: -34px;
            transform: translateX(-50%);
            font-size: 34px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 18px rgba(192,132,252,0.8);
        }

        .gem {
            position: absolute;
            top: -60px;
            font-size: 34px;
            color: #d8c4ff;
            text-shadow:
                0 0 14px rgba(196, 160, 255, 0.8),
                0 0 24px rgba(139, 92, 246, 0.55);
            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        .bad {
            color: #ff8aa8;
            text-shadow:
                0 0 14px rgba(255, 120, 160, 0.8),
                0 0 24px rgba(255, 60, 100, 0.45);
        }

        .pop {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            animation: popUp 0.8s ease forwards;
            z-index: 20;
        }

        @keyframes fall {
            0% {
                transform: translateY(-80px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(760px) rotate(360deg);
                opacity: 0.9;
            }
        }

        @keyframes popUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-35px);
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.45;
            }

            100% {
                opacity: 0.85;
            }
        }

        .hidden {
            display: none;
        }

        @media screen and (max-width: 700px) {
            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .score-box {
                width: 100%;
            }

            .info {
                flex: 1;
            }

            .title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrap" id="gameWrap">

        <div class="top-bar">
            <div class="title">
                <h1>Diamond Catch</h1>
                <p>마우스를 움직여 떨어지는 다이아몬드를 잡아보세요.</p>
            </div>

            <div class="score-box">
                <div class="info">
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>
                <div class="info">
                    <span>TIME</span>
                    <strong id="time">30</strong>
                </div>
            </div>
        </div>

        <div class="player" id="player"></div>

        <div class="start-screen" id="startScreen">
            <div class="panel">
                <h2>Secret Game</h2>
                <p>
                    다이아몬드 아이콘을 발견했군요!<br>
                    30초 동안 보석을 잡으면 점수가 올라가고, 빨간 보석은 피해야 합니다.
                </p>
                <button type="button" onclick="startGame()">게임 시작</button>
            </div>
        </div>

        <div class="end-screen hidden" id="endScreen">
            <div class="panel">
                <h2>Game Over</h2>
                <p>
                    최종 점수는 <strong id="finalScore">0</strong>점입니다.
                </p>
                <button type="button" onclick="startGame()">다시 하기</button>
            </div>
        </div>

    </div>

    <script>
        const gameWrap = document.getElementById("gameWrap");
        const player = document.getElementById("player");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const startScreen = document.getElementById("startScreen");
        const endScreen = document.getElementById("endScreen");
        const finalScore = document.getElementById("finalScore");

        let score = 0;
        let timeLeft = 30;
        let gameRunning = false;
        let spawnTimer;
        let countdownTimer;
        let playerX = 0;

        function movePlayer(x) {
            const rect = gameWrap.getBoundingClientRect();
            playerX = Math.max(55, Math.min(x - rect.left, rect.width - 55));
            player.style.left = playerX + "px";
        }

        gameWrap.addEventListener("mousemove", (e) => {
            movePlayer(e.clientX);
        });

        gameWrap.addEventListener("touchmove", (e) => {
            const touch = e.touches[0];
            movePlayer(touch.clientX);
        });

        function startGame() {
            document.querySelectorAll(".gem, .pop").forEach(el => el.remove());

            score = 0;
            timeLeft = 30;
            gameRunning = true;

            scoreText.textContent = score;
            timeText.textContent = timeLeft;

            startScreen.classList.add("hidden");
            endScreen.classList.add("hidden");

            spawnTimer = setInterval(createGem, 650);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeText.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(spawnTimer);
            clearInterval(countdownTimer);

            finalScore.textContent = score;
            endScreen.classList.remove("hidden");
        }

        function createGem() {
            if (!gameRunning) return;

            const gem = document.createElement("div");
            const isBad = Math.random() < 0.22;

            gem.className = isBad ? "gem bad" : "gem";
            gem.textContent = isBad ? "◆" : "◇";

            const rect = gameWrap.getBoundingClientRect();
            const x = Math.random() * (rect.width - 60) + 30;
            const duration = Math.random() * 1.5 + 3.1;

            gem.style.left = x + "px";
            gem.style.animationDuration = duration + "s";

            gameWrap.appendChild(gem);

            const check = setInterval(() => {
                if (!gameRunning || !gem.parentNode) {
                    clearInterval(check);
                    return;
                }

                const gemRect = gem.getBoundingClientRect();
                const playerRect = player.getBoundingClientRect();

                const isHit =
                    gemRect.bottom >= playerRect.top &&
                    gemRect.top <= playerRect.bottom &&
                    gemRect.right >= playerRect.left &&
                    gemRect.left <= playerRect.right;

                if (isHit) {
                    if (isBad) {
                        score = Math.max(0, score - 3);
                        showPop("-3", gemRect.left, gemRect.top, "#ff8aa8");
                    } else {
                        score += 1;
                        showPop("+1", gemRect.left, gemRect.top, "#d8c4ff");
                    }

                    scoreText.textContent = score;
                    gem.remove();
                    clearInterval(check);
                }
            }, 30);

            setTimeout(() => {
                if (gem.parentNode) gem.remove();
                clearInterval(check);
            }, duration * 1000);
        }

        function showPop(text, x, y, color) {
            const pop = document.createElement("div");
            pop.className = "pop";
            pop.textContent = text;
            pop.style.left = x + "px";
            pop.style.top = y + "px";
            pop.style.color = color;
            gameWrap.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 800);
        }
    </script>

</body>
</html>
