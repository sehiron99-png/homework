<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>일상 기록 - Flip Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, "맑은 고딕", sans-serif;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(150, 110, 255, 0.18), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(110, 80, 255, 0.15), transparent 35%),
                linear-gradient(180deg, #0b0b0f 0%, #11111a 45%, #050507 100%);
            color: white;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 15% 20%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 28% 70%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 45% 35%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 65% 60%, rgba(255,255,255,0.45), transparent),
                radial-gradient(2px 2px at 82% 25%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.5), transparent);
            opacity: 0.55;
            animation: twinkle 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .clock-wrap {
            width: 100%;
            min-height: 100vh;
            padding: 35px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .title {
            margin-bottom: 34px;
            animation: fadeDown 0.8s ease both;
        }

        .title h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 8px;
            color: #ffffff;
        }

        .title p {
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            letter-spacing: 2px;
        }

        .flip-clock {
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            animation: fadeUp 1s ease both;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digit-row {
            display: flex;
            gap: 8px;
        }

        .flip-digit {
            position: relative;
            width: 82px;
            height: 118px;
            perspective: 700px;
            border-radius: 14px;
            overflow: hidden;
            background: #151515;
            box-shadow:
                0 18px 34px rgba(0, 0, 0, 0.55),
                0 0 28px rgba(155, 110, 255, 0.12);
        }

        .flip-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10;
        }

        .top,
        .bottom,
        .flip-top,
        .flip-bottom {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            font-size: 82px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.74);
            background: linear-gradient(180deg, #252525 0%, #171717 100%);
        }

        .top,
        .flip-top {
            top: 0;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.8);
        }

        .bottom,
        .flip-bottom {
            bottom: 0;
            align-items: flex-start;
            background: linear-gradient(180deg, #111111 0%, #232323 100%);
        }

        .top span,
        .flip-top span {
            transform: translateY(50%);
        }

        .bottom span,
        .flip-bottom span {
            transform: translateY(-50%);
        }

        .flip-top {
            z-index: 6;
            transform-origin: bottom;
            backface-visibility: hidden;
        }

        .flip-bottom {
            z-index: 5;
            transform-origin: top;
            transform: rotateX(90deg);
            backface-visibility: hidden;
        }

        .flip-digit.flipping .flip-top {
            animation: flipTop 0.35s ease-in forwards;
        }

        .flip-digit.flipping .flip-bottom {
            animation: flipBottom 0.35s ease-out 0.35s forwards;
        }

        .label {
            margin-top: 12px;
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.48);
        }

        .colon {
            margin-bottom: 34px;
            font-size: 50px;
            font-weight: 900;
            color: rgba(190, 160, 255, 0.85);
            text-shadow: 0 0 22px rgba(160, 120, 255, 0.55);
            animation: blinkColon 1s ease-in-out infinite;
        }

        .ampm {
            margin-bottom: 34px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        @keyframes flipTop {
            0% {
                transform: rotateX(0deg);
            }

            100% {
                transform: rotateX(-90deg);
            }
        }

        @keyframes flipBottom {
            0% {
                transform: rotateX(90deg);
            }

            100% {
                transform: rotateX(0deg);
            }
        }

        @keyframes blinkColon {
            0%, 100% {
                opacity: 0.25;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-25px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.35;
            }

            100% {
                opacity: 0.75;
            }
        }

        @media screen and (max-width: 760px) {
            .flip-clock {
                gap: 8px;
            }

            .flip-digit {
                width: 62px;
                height: 90px;
            }

            .top,
            .bottom,
            .flip-top,
            .flip-bottom {
                font-size: 62px;
            }

            .colon {
                font-size: 36px;
            }

            .ampm {
                font-size: 16px;
                padding: 8px 10px;
            }

            .label {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="clock-wrap">
        <div class="title">
            <h1>일상 기록</h1>
            <p>Flip Clock</p>
        </div>

        <div class="flip-clock">

            <div class="ampm" id="ampm">AM</div>

            <div class="time-group">
                <div class="digit-row">
                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>

                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>
                </div>
                <div class="label">HOUR</div>
            </div>

            <div class="colon">:</div>

            <div class="time-group">
                <div class="digit-row">
                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>

                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>
                </div>
                <div class="label">MIN</div>
            </div>

            <div class="colon">:</div>

            <div class="time-group">
                <div class="digit-row">
                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>

                    <div class="flip-digit" data-value="0">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="flip-top"><span>0</span></div>
                        <div class="flip-bottom"><span>0</span></div>
                    </div>
                </div>
                <div class="label">SEC</div>
            </div>

        </div>
    </div>

    <script>
        const digitElements = document.querySelectorAll(".flip-digit");
        const ampmElement = document.getElementById("ampm");

        function setDigit(digit, newValue, instant = false) {
            const oldValue = digit.dataset.value;

            if (oldValue === newValue) return;

            const top = digit.querySelector(".top span");
            const bottom = digit.querySelector(".bottom span");
            const flipTop = digit.querySelector(".flip-top span");
            const flipBottom = digit.querySelector(".flip-bottom span");

            if (instant) {
                top.textContent = newValue;
                bottom.textContent = newValue;
                flipTop.textContent = newValue;
                flipBottom.textContent = newValue;
                digit.dataset.value = newValue;
                return;
            }

            flipTop.textContent = oldValue;
            flipBottom.textContent = newValue;

            digit.classList.add("flipping");

            setTimeout(() => {
                top.textContent = newValue;
            }, 350);

            setTimeout(() => {
                bottom.textContent = newValue;
                flipTop.textContent = newValue;
                flipBottom.textContent = newValue;
                digit.dataset.value = newValue;
                digit.classList.remove("flipping");
            }, 700);
        }

        function updateClock(instant = false) {
            const now = new Date();

            let hours = now.getHours();
            const ampm = hours >= 12 ? "PM" : "AM";

            hours = hours % 12;
            hours = hours ? hours : 12;

            const hourText = String(hours).padStart(2, "0");
            const minuteText = String(now.getMinutes()).padStart(2, "0");
            const secondText = String(now.getSeconds()).padStart(2, "0");

            const timeText = hourText + minuteText + secondText;

            ampmElement.textContent = ampm;

            digitElements.forEach((digit, index) => {
                setDigit(digit, timeText[index], instant);
            });
        }

        updateClock(true);
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
